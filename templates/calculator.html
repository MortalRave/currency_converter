<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Standardowy Kalkulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .calc-container {
            background-color: #2c3e50;
            padding: 20px;
            width: 470px;
            border-radius: 10px;
            margin: 0 auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .display {
            background-color: #a3f7bf;
            padding: 15px;
            text-align: right;
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            border-radius: 5px;
            min-height: 35px;
            border: inset 2px #7bc995;
            word-wrap: break-word;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-btn {
            background-color: #ecf0f1;
            border: none;
            padding: 15px 0;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
        }
        .calc-btn:hover { background-color: #bdc3c7; }
        .calc-btn.operator { background-color: #f39c12; color: white; }
        .calc-btn.operator:hover { background-color: #e67e22; }
        .calc-btn.equal { background-color: #27ae60; color: white; grid-column: span 2; }
        .calc-btn.equal:hover { background-color: #2ecc71; }
        .calc-btn.clear { background-color: #c0392b; color: white; grid-column: span 1; }
        .calc-btn.clear:hover { background-color: #e74c3c; }
        .calc-btn.backspace { background-color: #f39c12; color: white; grid-column: span 2; }
        .calc-btn.backspace:hover { background-color: #e67e22; }
    </style>
</head>
<body>
    <div class="calc-container">
        <!-- Ekran wyświetlający wpisywane działanie lub wynik -->
        <div class="display" id="screen">
            {% if result is not none %}{{ result }}{% else %}0{% endif %}
        </div>

        <!-- Formularz, który wyśle ukryte pole z pełnym równaniem do Pythona -->
        <form action="/calculator" method="POST" id="calcForm">
            <input type="hidden" name="expression" id="hiddenExpression" value="">
            
            <div class="button-grid">
                <button type="button" class="calc-btn backspace" onclick="backspace()">⬅</button>                
                <button type="button" class="calc-btn clear" onclick="clearScreen()">C</button>

                <button type="button" class="calc-btn operator" onclick="addOperator(' / ')">&divide;</button>
                
                <button type="button" class="calc-btn" onclick="addNumber('7')">7</button>
                <button type="button" class="calc-btn" onclick="addNumber('8')">8</button>
                <button type="button" class="calc-btn" onclick="addNumber('9')">9</button>
                <button type="button" class="calc-btn operator" onclick="addOperator(' * ')">&times;</button>
                
                <button type="button" class="calc-btn" onclick="addNumber('4')">4</button>
                <button type="button" class="calc-btn" onclick="addNumber('5')">5</button>
                <button type="button" class="calc-btn" onclick="addNumber('6')">6</button>
                <button type="button" class="calc-btn operator" onclick="addOperator(' - ')">-</button>
                
                <button type="button" class="calc-btn" onclick="addNumber('1')">1</button>
                <button type="button" class="calc-btn" onclick="addNumber('2')">2</button>
                <button type="button" class="calc-btn" onclick="addNumber('3')">3</button>
                <button type="button" class="calc-btn operator" onclick="addOperator(' + ')">+</button>
                
                <button type="button" class="calc-btn" onclick="addNumber('0')">0</button>
                <button type="button" class="calc-btn" onclick="addNumber('.')">.</button>
                <!-- Przycisk równe wysyła formularz -->
                <button type="submit" class="calc-btn equal" onclick="submitForm()">=</button>
            </div>
        </form>
        <a href="/" style="display: block; margin-top: 20px; color: #ecf0f1; text-decoration: none; text-align: center;">&larr; Powrót do menu</a>
    </div>

    <!-- Krótki skrypt JS, który dopisuje znaki do ekranu -->
    <script>
        let currentExpression = "";
        const screen = document.getElementById("screen");
        const hiddenInput = document.getElementById("hiddenExpression");

        function addNumber(num) {
            currentExpression += num;
            updateScreen();
        }
        function addOperator(op) {
            // Dodajemy operator ze spacjami po bokach (np. " + "), co baaardzo ułatwi nam pracę w Pythonie!
            currentExpression += op;
            updateScreen();
        }
        function clearScreen() {
            currentExpression = "";
            updateScreen();
        }
        function updateScreen() {
            screen.innerText = currentExpression === "" ? "0" : currentExpression;
        }
        function submitForm() {
            // Zapisujemy całe równanie do ukrytego pola przed wysłaniem do Pythona
            hiddenInput.value = currentExpression;
        }
        function backspace() {
            currentExpression = currentExpression.slice(0, -1);
             updateScreen();
        }
    </script>
</body>
</html>
