<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przelicznik Walut</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <form action="/currency" method="POST">
    <h1>Przelicz swoje PLN</h1>    
        <label>Kwota w PLN:</label>
        <input type="number" name="amount" step="any" min="0" required> 
        <br>
        <label>Wybierz walutę:</label>
        <select name="currency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="HUF">HUF</option>
            <option value="CZK">CZK</option>
        </select>

        <button type="submit">Przelicz</button>
        <br>
     {% if result %}
        <h3>Aktualny kurs {{ target_currency }}: {{ currency_rate }} PLN</h3>
        <h2>Otrzymasz: {{ result }} {{ target_currency }}</h2>
    {% endif %}  
         
        <a href="/" style="display: inline-block; margin-top: 15px; color: #007bff; text-decoration: none;">&larr; Powrót do menu</a>
    </form>

    
</body>
</html>
