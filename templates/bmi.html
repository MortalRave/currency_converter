<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator BMI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <form action="/bmi" method="POST">
        <h1>Kalkulator BMI</h1>
        
        <label>Twoja waga (w kg):</label>
        <input type="number" name="weight" step="any" min="0" required>
        <br>
        <label>Twój wzrost (w cm):</label>
        <input type="number" name="height" step="any" min="0" required>
        <br>
        <button type="submit">Oblicz BMI</button>

        <!-- Sekcja wyświetlania wyniku -->
        {% if result %}
            <hr style="margin: 20px 0;">
            <h2>Twoje BMI wynosi: {{ result }}</h2>
            <h3>Status: {{ status }}</h3>
        {% endif %}
        
        <!-- Link powrotny do menu -->
        <br>
        <a href="/" style="display: inline-block; margin-top: 15px; color: #007bff; text-decoration: none;">&larr; Powrót do menu</a>
    </form>
</body>
</html>
